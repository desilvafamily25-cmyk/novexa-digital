<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOVEXA DIGITAL — Coming Soon</title>
    <meta name="description" content="Premium websites for healthcare professionals. Coming soon.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            padding: 2rem;
        }
        
        .container {
            text-align: center;
            max-width: 600px;
        }
        
        .logo {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #60a5fa 0%, #a78bfa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .tagline {
            font-size: 1.125rem;
            color: #94a3b8;
            margin-bottom: 3rem;
            font-weight: 400;
        }
        
        .coming-soon {
            font-size: 1rem;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            margin-bottom: 2rem;
        }
        
        .divider {
            width: 60px;
            height: 2px;
            background: linear-gradient(90deg, #60a5fa, #a78bfa);
            margin: 0 auto 2rem;
            border-radius: 1px;
        }
        
        .description {
            font-size: 1.125rem;
            line-height: 1.7;
            color: #cbd5e1;
            margin-bottom: 3rem;
        }
        
        .contact {
            font-size: 0.95rem;
            color: #64748b;
        }
        
        .contact a {
            color: #60a5fa;
            text-decoration: none;
            transition: color 0.2s;
        }
        
        .contact a:hover {
            color: #93c5fd;
        }
        
        @media (max-width: 640px) {
            .logo {
                font-size: 2rem;
            }
            .tagline {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="logo">NOVEXA DIGITAL</h1>
        <p class="tagline">Premium websites for healthcare professionals</p>
        
        <div class="divider"></div>
        
        <p class="coming-soon">Coming Soon</p>
        
        <p class="description">
            We're building something special for healthcare businesses — 
            modern, professional websites you actually own.
        </p>
        
        <p class="contact">
            Get in touch: <a href="mailto:hello@novexadigital.com.au">hello@novexadigital.com.au</a>
        </p>
    </div>
</body>
</html>
